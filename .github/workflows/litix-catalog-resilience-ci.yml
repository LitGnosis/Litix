name: Litix resilient read-only catalog fallback tests
on:
  pull_request:
    paths:
      - "src/lib/litixCatalogResilience.mjs"
      - "src/lib/boosteroCatalog.mjs"
      - "src/lib/activeStorefrontCatalog.mjs"
      - "src/app/api/catalog/v1/route.js"
      - "src/tests/litix-catalog-resilience.test.mjs"
      - ".github/workflows/litix-catalog-resilience-ci.yml"
permissions:
  contents: read
jobs:
  catalog-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src
      - run: node --test tests/litix-catalog-resilience.test.mjs
        working-directory: src
