name: Litix Guardian — Independent uptime and encrypted-backup watchdog
# This workflow must be on DEFAULT main for GitHub's scheduler to run.
on:
  # Single kick-off on installation, then independent default-branch schedule.
  push:
    branches: [main]
    paths:
      - ".github/workflows/litix-guardian-external.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: litix-guardian-independent-watchdog
  cancel-in-progress: false
jobs:
  external-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify safe watchdog logic without hitting real databases
        run: node --test src/tests/guardian-external-backup.test.mjs
      - name: Independent website/catalog and encrypted R2 backup checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITIX_GUARDIAN_EXTERNAL_RESEND_KEY: ${{ secrets.LITIX_GUARDIAN_EXTERNAL_RESEND_KEY }}
        run: node src/scripts/guardian-external-monitor.mjs
