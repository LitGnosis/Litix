name: Litix AutoLikes validation
on:
  push:
    branches:
      - feature/litix-autolikes-subscription-sandbox-20261025
      - repair/autolikes-recover-live-20261025
  pull_request:
    paths:
      - 'src/app/api/autolikes/**'
      - 'src/app/api/account/subscribe/**'
      - 'src/app/account/AutoLikes*'
      - 'src/lib/liveAutoLikes.mjs'
      - 'src/tests/*autolikes*'
      - 'src/db/migrations/*autolikes*'
      - '.github/workflows/litix-autolikes-ci.yml'
permissions:
  contents: read
jobs:
  nonfinancial-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Next.js dependencies
        run: npm ci --no-audit --no-fund
        working-directory: src
      - name: Run regression tests without external payments
        run: node --test tests/*.test.mjs
        working-directory: src
      - name: Build Next.js
        run: npm run build
        working-directory: src
