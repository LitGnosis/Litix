name: Litix verified purchase notifications (mock-only)
on:
  pull_request:
    paths:
      - 'src/vercel.json'
      - 'src/lib/ownerNotifications.mjs'
      - 'src/lib/orderNotifications.mjs'
      - 'src/lib/bundleOrders.mjs'
      - 'src/app/api/bundles/**'
      - 'src/app/api/[action]/route.js'
      - 'src/tests/owner-purchase-notifications.test.mjs'
      - '.github/workflows/litix-owner-notifications-ci.yml'
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src
      - name: Mock verified payment emails and manual bundle fulfillment — never charge real cards
        run: node --test tests/owner-purchase-notifications.test.mjs tests/growth-bundles-manual.test.mjs
        working-directory: src
      - name: Verify only bundle settlement polling is minute-level
        run: node --input-type=module -e 'import {readFileSync} from "node:fs"; const c=JSON.parse(readFileSync("vercel.json","utf8")); if(c.crons.find(x=>x.path==="/api/bundles/cron")?.schedule!=="* * * * *") process.exit(1); if(c.crons.find(x=>x.path==="/api/v2/cron/sync-catalog")?.schedule!=="0 0 * * *") process.exit(1)'
        working-directory: src
