name: Litix Global Phase 1 — no-charge baseline and accessibility checks
on:
  push:
    branches:
      - feature/litix-global-phase1-a11y-handoff-20261028
  pull_request:
    paths:
      - "src/components/LitixAI.jsx"
      - "src/app/litix-ai.css"
      - "src/tests/litix-ai-accessibility.test.mjs"
      - "src/tests/litix-ai.test.mjs"
      - "docs/LITIX-GLOBAL-ROADMAP-2026-10-28.md"
      - ".github/workflows/litix-global-phase1-ci.yml"
permissions:
  contents: read
jobs:
  preserve-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Reproducible dependency install
        run: npm ci --no-audit --no-fund
      - name: Original production functionality (mocked, no-charge tests)
        run: |
          node --test \
            tests/litix-ai.test.mjs \
            tests/checkout.test.mjs \
            tests/collect-lifecycle.test.mjs \
            tests/guardian.test.mjs \
            tests/owner-purchase-notifications.test.mjs \
            tests/growth-bundles-manual.test.mjs \
            tests/boostero-exclusive-new-orders.test.mjs \
            tests/boostero-only-public-catalog-regression.test.mjs \
            tests/public-supplier-display.test.mjs
      - name: Build Next.js in isolated CI
        env:
          LITIX_AI_VERIFIED: "false"
        run: npm run build
      - name: Install isolated browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Browser regression — iPhone and desktop floating buttons (no live requests)
        run: |
          npm run start -- --port 3100 >/tmp/litix-global-phase1.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent -o /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/litix-floating-buttons-mobile.mjs
          if [ -f tests/litix-ai-accessibility.test.mjs ]; then node tests/litix-ai-accessibility.test.mjs; fi
