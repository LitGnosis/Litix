name: Litix live curated recovery - no-charge QA
on:
  push:
    branches:
      - fix/litix-live-curated-service-fallback-20261115
  pull_request:
    branches:
      - main
    paths:
      - src/lib/curatedCatalog.mjs
      - src/components/CuratedFastCheckout.jsx
      - src/app/page.jsx
      - src/tests/litix-live-fallback-*
      - .github/workflows/litix-live-curated-recovery-20261115.yml
permissions:
  contents: read
jobs:
  verified-curated-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    defaults:
      run:
        working-directory: src
    env:
      NEXT_PUBLIC_LITIX_CURATED_STOREFRONT_ENABLED: "true"
      NEXT_PUBLIC_LITIX_CART_BUMPS_ENABLED: "false"
      LITIX_CART_BUMPS_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test verified supplier choices, legacy pricing and SEO checkout
        run: node --test tests/litix-live-fallback-20261115.test.mjs tests/litix-curated-storefront-20261114.test.mjs tests/litix-seo-first-paint-20261114.test.mjs tests/litix-curated-copy-cleanup-20261115.test.mjs
      - name: Build production Next.js
        run: npm run build
      - name: Install isolated browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify no-charge mobile and desktop fallback checkout
        run: |
          npm run start -- --port 3100 >/tmp/litix-fallback-ui.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/litix-live-fallback-browser-20261115.mjs
