name: Litix instant checkout and cart bump - no-charge QA
on:
  push:
    branches:
      - feature/litix-fast-first-paint-cart-bump-proof-20261114
  pull_request:
    branches:
      - main
    paths:
      - src/lib/litixCart*
      - src/lib/cartBumpConfig.mjs
      - src/lib/curatedStaticPreview.mjs
      - src/components/CuratedFastCheckout.jsx
      - src/app/page.jsx
      - src/app/api/checkout/**
      - src/app/api/admin/orders/proof/**
      - src/app/api/track/**
      - src/app/track/**
      - src/db/migrations/20261114_litix_cart_bump_order_proof.sql
      - src/tests/litix-cart-first-paint-*
      - .github/workflows/litix-cart-bump-proof-20261114.yml
permissions:
  contents: read
jobs:
  no-charge-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    env:
      NEXT_PUBLIC_LITIX_CURATED_STOREFRONT_ENABLED: "true"
      NEXT_PUBLIC_LITIX_CART_BUMPS_ENABLED: "true"
      LITIX_CART_BUMPS_ENABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify cart pricing, first paint, tracking proofs and legacy checkout safety
        run: node --test tests/litix-cart-first-paint-proof-20261114.test.mjs tests/litix-curated-storefront-20261114.test.mjs
      - name: Build Next.js production app
        run: npm run build
      - name: Install isolated browser test runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Run mobile and desktop no-charge browser checks
        run: |
          npm run start -- --port 3100 >/tmp/litix-cart-ui.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/litix-cart-first-paint-browser-20261114.mjs
