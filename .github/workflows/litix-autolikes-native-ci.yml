name: Litix AutoLikes — Boostero native no-charge compatibility
on:
  pull_request:
    paths:
      - 'src/lib/boosteroNativeAutoLikes.mjs'
      - 'src/lib/boosteroReadOnly.mjs'
      - 'src/lib/nmiQueryEvidence.mjs'
      - 'src/lib/nmiAutoLikesRecurring.mjs'
      - 'src/lib/nativeAutoLikesFulfillment.mjs'
      - 'src/app/autolikes/**'
      - 'src/db/migrations/20261101-autolikes-boostero-native-cycles.sql'
      - 'src/vercel.json'
      - 'src/app/api/autolikes/**'
      - 'src/tests/boostero-native-autolikes.test.mjs'
      - 'src/tests/autolikes-native-billing-safety.test.mjs'
      - 'src/tests/autolikes-coming-soon.test.mjs'
      - '.github/workflows/litix-autolikes-native-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Supplier native AutoLikes no-payment tests
        run: node --test tests/boostero-native-autolikes.test.mjs tests/autolikes-native-billing-safety.test.mjs tests/autolikes-coming-soon.test.mjs tests/boostero-batch-status.test.mjs
      - name: Build existing Litix
        run: npm run build
