name: Litix Global — safe app manifest, no-charge regressions
on:
  push:
    branches: [feature/litix-global-mobile-manifest-20261028]
  pull_request:
    paths:
      - "src/app/manifest.js"
      - "src/public/icons/**"
      - "src/tests/global-pwa-manifest.test.mjs"
      - ".github/workflows/litix-global-pwa-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test manifest and existing no-charge payment, AI, Boostero, SEO and bundle behavior
        run: |
          node --test tests/global-pwa-manifest.test.mjs tests/litix-ai.test.mjs tests/checkout.test.mjs tests/boostero-integration.test.mjs tests/growth-bundles-manual.test.mjs tests/global-locales.test.mjs tests/global-seo-preservation.test.mjs
      - name: Validate app icons with PNG signature, dimensions, and file size
        run: |
          python - <<'PY'
          import pathlib,struct
          for size in (192,512):
            p=pathlib.Path(f"public/icons/litix-app-{size}.png")
            content=p.read_bytes()
            assert content[:8]==b"\x89PNG\r\n\x1a\n",p
            assert struct.unpack(">II",content[16:24])==(size,size),p
            assert len(content)>1024 and len(content)<2000000,p
            print("ICON_VERIFIED",p,len(content))
          PY
      - name: Preserve Next.js production build
        run: npm run build
