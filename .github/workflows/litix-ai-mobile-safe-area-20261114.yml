name: Litix AI mobile modal — safe area, privacy and no-charge browser QA
on:
  push:
    branches:
      - fix/litix-ai-ios-modal-privacy-20261114
      - fix/litix-ai-tracking-copy-catalog-pace-20261114
  pull_request:
    paths:
      - src/components/LitixAI.jsx
      - src/app/litix-ai.css
      - src/app/layout.jsx
      - src/lib/litixGuidedSupport.mjs
      - src/app/api/litix-ai/route.js
      - src/tests/litix-ai-mobile-20261114.test.mjs
      - src/tests/litix-ai-mobile-browser-20261114.mjs
      - .github/workflows/litix-ai-mobile-safe-area-20261114.yml
permissions:
  contents: read
jobs:
  modal-no-charge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Safety and mobile layout unit regressions
        run: node --test tests/litix-ai.test.mjs tests/litix-ai-mobile-20261114.test.mjs tests/litix-bundles-retired-20261114.test.mjs tests/litix-package-tiers-quantity-20261114.test.mjs
      - name: Compile production Next.js
        run: npm run build
      - name: Install isolated browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Check 320/375/390/430/1280 layouts and private inputs without any transactions
        run: |
          npm run start -- --port 3100 >/tmp/litix-ai-safe-area.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/litix-ai-mobile-browser-20261114.mjs
          node tests/litix-ai-accessibility.test.mjs
          node tests/litix-floating-buttons-mobile.mjs
