name: Litix Boostero premium migration — safe read-only Preview checks
on:
  push:
    branches:
      - feature/boostero-premium-migration-20261027
  pull_request:
    paths:
      - "src/lib/boosteroPremiumCatalog.mjs"
      - "src/app/api/premium/**"
      - "src/app/premium-preview/**"
      - "src/tests/boostero-premium-*"
      - ".github/workflows/boostero-premium-preview-ci.yml"
permissions:
  contents: read
jobs:
  no-payment-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all Node tests; exclude browser suite until Playwright installation
        run: |
          test_files="$(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'dual-provider-mobile.test.mjs' | sort | tr '\n' ' ')"
          node --test $test_files
      - name: Build with existing Next.js configuration
        run: npm run build
      - name: Install browser harness without modifying lock file
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify premium Preview 320–1280px and unchanged bundle checkout
        run: |
          npm run start -- --port 3100 >/tmp/litix-boostero-premium.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://localhost:3100/premium-preview; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/boostero-premium-mobile.mjs
          node tests/dual-provider-mobile.test.mjs
