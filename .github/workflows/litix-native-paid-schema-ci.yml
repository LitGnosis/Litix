name: Litix Native paid schema — isolated PostgreSQL
on:
  pull_request:
    paths:
      - "src/db/litix_native_paid_orders.sql"
      - ".github/workflows/litix-native-paid-schema-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: litix_native_paid_qa
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d litix_native_paid_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout without retaining credentials
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Apply additive schema twice in disposable PostgreSQL
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=postgres:16-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp src/db/litix_native_paid_orders.sql "$container_id:/tmp/native_paid.sql"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U postgres -d litix_native_paid_qa -f /tmp/native_paid.sql
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U postgres -d litix_native_paid_qa -f /tmp/native_paid.sql
          count="$(docker exec "$container_id" psql -t -A -U postgres -d litix_native_paid_qa -c "select count(*) from information_schema.tables where table_schema='public' and table_name in ('litix_native_paid_orders','litix_native_email_outbox')")"
          test "$count" = "2"
          echo "Both isolated Native paid tables exist; no production database was accessed."
