name: Litix Native independent global supply — fail-closed capacity QA
on:
  pull_request:
    paths:
      - "src/lib/litixNativeSupplyCapacity.mjs"
      - "src/lib/litixNativePublisherInquiry.mjs"
      - "src/app/api/native/v1/capabilities/**"
      - "src/app/native/supply/**"
      - "src/app/publishers/**"
      - "src/components/LitixPublisherApplication.jsx"
      - "src/tests/litixNativeSupplyCapacity.test.mjs"
      - ".github/workflows/litix-native-capacity-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source without persisting credentials
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Test verified capacity, no false engagement supply, and reviewed partner intake
        working-directory: src
        run: |
          set -euo pipefail
          node --test tests/litixNativeSupplyCapacity.test.mjs
