name: Follower username and profile checkout regression
on:
  push:
    branches: [fix/follower-username-profile-checkout-20261026]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Test follower destination and existing checkout regressions
        working-directory: src
        run: node --test tests/*.test.mjs
      - name: Build Next.js production bundle
        working-directory: src
        run: npm run build
