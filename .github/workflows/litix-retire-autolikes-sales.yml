name: Litix AutoLikes — Suspend New Sales / Preserve Tracking
on:
  push:
    branches: ["fix/retire-unverified-autolikes-sales-20261104"]
  pull_request:
    paths:
      - "src/app/autolikes/page.jsx"
      - "src/app/page.jsx"
      - "src/app/api/autolikes/**"
      - "src/lib/litixAutoLikesSalesGate.mjs"
      - "src/tests/autolikes-coming-soon.test.mjs"
      - ".github/workflows/litix-retire-autolikes-sales.yml"
permissions:
  contents: read
jobs:
  no-charge-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check src/lib/litixAutoLikesSalesGate.mjs
      - run: node --test src/tests/autolikes-coming-soon.test.mjs
      - name: Verify payment and supplier code untouched by guard
        run: |
          grep -q 'on conflict(idempotency_key) do nothing' src/app/api/autolikes/prepaid/checkout/route.js
          grep -q 'syncPrepaidAutoLikes' src/app/api/autolikes/prepaid/cron/route.js
          grep -q 'public_token_hash' src/app/api/autolikes/prepaid/manage/route.js
