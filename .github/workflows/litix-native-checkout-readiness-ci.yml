name: Litix Native checkout activation — zero-charge safety checks
on:
  pull_request:
    paths:
      - "src/app/native/premium/**"
      - "src/app/api/native/v1/paid/**"
      - "src/components/LitixNativePremiumCheckout.jsx"
      - "src/lib/litixNativeCheckoutReadiness.mjs"
      - "src/tests/litixNativeCheckoutReadiness.test.mjs"
      - ".github/workflows/litix-native-checkout-readiness-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Read reviewed source without retaining Git credentials
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Run isolated margin, NMI, and safe readiness checks (no secrets, cards, or network)
        working-directory: src
        run: |
          set -euo pipefail
          node --test tests/litixNativeCheckoutReadiness.test.mjs tests/litixNativePaidEngine.test.mjs tests/litixNativePremiumAssets.test.mjs
