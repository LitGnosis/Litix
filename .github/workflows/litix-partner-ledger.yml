name: Litix partner ledger security and no-charge QA
on:
  pull_request:
    paths:
      - 'ops/partner-ledger/**'
      - '.github/workflows/litix-partner-ledger.yml'
  push:
    branches:
      - feature/20261110-safe-partner-ledger
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile worker and models
        run: python -m compileall -q ops/partner-ledger/litix_partner_ledger
      - name: Verify signed updates and fail-closed release
        run: python -m unittest discover -s ops/partner-ledger/tests -p 'test_*.py' -v
      - name: Prohibit dangerous seed and simulated completion
        run: |
          ! grep -R -nE "5000\.0000|lx_live_67f2|asyncio\.sleep\(2\.0\)|SET delivery_state = 'COMPLETED'|redis\.blpop" ops/partner-ledger
