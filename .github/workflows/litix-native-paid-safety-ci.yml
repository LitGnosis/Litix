name: Litix Native independent paid order safety
on:
  pull_request:
    paths:
      - "src/lib/litixNativePremiumAssets.mjs"
      - "src/lib/litixNativeCommercePolicy.mjs"
      - "src/lib/litixNativePaidEngine.mjs"
      - "src/app/api/native/v1/paid/**"
      - "src/app/native/order/**"
      - "src/components/LitixNativeOrderStatus.jsx"
      - "src/tests/litixNativePaidEngine.test.mjs"
      - "src/tests/litixNativePremiumAssets.test.mjs"
      - ".github/workflows/litix-native-paid-safety-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-charge-gateway-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Run isolated NMI and Resend mocks, no network or secrets
        working-directory: src
        run: |
          set -euo pipefail
          node --test tests/litixNativePaidEngine.test.mjs tests/litixNativePremiumAssets.test.mjs
