name: Litix Global — six-language SEO and mobile nonbilling verification
on:
  push:
    branches: [feature/litix-global-six-language-pages-20261028]
  pull_request:
    paths:
      - "src/lib/globalLocales.mjs"
      - "src/app/global/**"
      - "src/app/sitemap.js"
      - "src/app/robots.js"
      - "src/tests/global-seo-preservation.test.mjs"
      - "src/app/page.jsx"
      - "src/tests/global-locales*"
      - ".github/workflows/litix-global-i18n-ci.yml"
permissions:
  contents: read
jobs:
  i18n-no-charge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Exact locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Validate all six translations and preserved checkout/Boostero protections
        run: |
          node --test \
            tests/global-locales.test.mjs \
            tests/global-seo-preservation.test.mjs \
            tests/checkout.test.mjs \
            tests/collect-lifecycle.test.mjs \
            tests/boostero-integration.test.mjs \
            tests/boostero-live-fulfillment.test.mjs \
            tests/guardian.test.mjs \
            tests/owner-purchase-notifications.test.mjs \
            tests/growth-bundles-manual.test.mjs \
            tests/litix-ai.test.mjs \
            tests/public-supplier-display.test.mjs
      - name: Compile all Next.js pages including static language variants
        run: npm run build
      - name: Isolated browser dependency only; no lockfile edit
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify mobile languages, Arabic RTL, canonical metadata and existing AI/WhatsApp controls
        run: |
          npm run start -- --port 3100 >/tmp/litix-global-i18n.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 35); do
            if curl --fail --silent -o /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          curl --fail --silent http://localhost:3100/sitemap.xml | grep -q 'https://litix.net/global/ar'
          curl --fail --silent http://localhost:3100/sitemap.xml | grep -q 'https://litix.net/about'
          curl --fail --silent http://localhost:3100/robots.txt | grep -q 'Disallow: /checkout'
          node tests/global-locales-mobile.mjs
          node tests/litix-floating-buttons-mobile.mjs
