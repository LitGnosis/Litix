name: AutoLikes coming-soon checkout
on:
  push:
    branches: [ui/autolikes-coming-soon-20261025]
permissions:
  contents: read
jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: src
      - name: Verify coming-soon and existing checkout isolation
        run: node --test tests/autolikes-coming-soon.test.mjs
        working-directory: src
      - name: Build Next.js
        run: npm run build
        working-directory: src
