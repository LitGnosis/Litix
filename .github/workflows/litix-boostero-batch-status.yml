name: Litix Boostero batch-status tests
on:
  pull_request:
    paths:
      - "src/lib/boosteroStatusBatch.mjs"
      - "src/lib/boosteroReadOnly.mjs"
      - "src/lib/boosteroMultiPostFulfillment.mjs"
      - "src/tests/boostero-batch-status.test.mjs"
      - ".github/workflows/litix-boostero-batch-status.yml"
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test src/tests/boostero-batch-status.test.mjs
