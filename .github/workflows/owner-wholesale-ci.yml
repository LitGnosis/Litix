name: Owner Wholesale — Auth0 security and no-charge regression
on:
  push:
    branches:
      - feature/private-owner-wholesale-20261027
  pull_request:
    paths:
      - "src/app/owner/wholesale/**"
      - "src/components/OwnerWholesaleUI.jsx"
      - "src/lib/ownerAuth.mjs"
      - "src/lib/ownerWholesale*.mjs"
      - "src/app/api/owner/wholesale/**"
      - "src/tests/owner-wholesale-security.test.mjs"
      - "src/db/migrations/20261027-owner-wholesale.sql"
      - ".github/workflows/owner-wholesale-ci.yml"
permissions:
  contents: read
jobs:
  owner-security-and-regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Auth0 token, duplicate supplier-order and protected checkout plus existing feature regression (mocked)
        run: node --test tests/owner-wholesale-security.test.mjs tests/boostero-live-fulfillment.test.mjs tests/boostero-integration.test.mjs tests/checkout.test.mjs tests/preview-checkout.test.mjs tests/pricing-rules.test.mjs tests/five-dollar-floor.test.mjs tests/litix-ai.test.mjs tests/growth-bundles-manual.test.mjs tests/owner-purchase-notifications.test.mjs tests/guardian.test.mjs tests/autolikes-coming-soon.test.mjs
      - name: Build isolated owner interface and existing Next.js app without real charges
        run: npm run build
