name: Litix production Boostero-only — mobile READ ONLY smoke
on:
  push:
    branches: [test/litix-boostero-live-mobile-20261028]
permissions:
  contents: read
jobs:
  live-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Real website 390px, 412px, 1280px no-checkout smoke
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          node --test tests/boostero-only-live-mobile-smoke.mjs
