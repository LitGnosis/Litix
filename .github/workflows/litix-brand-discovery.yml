name: Litix Brand Discovery and Media Facts QA
on:
  push:
    branches:
      - growth/litix-visibility-media-famehero-20261109
  pull_request:
    paths:
      - "src/lib/litixBrandDiscovery.mjs"
      - "src/app/layout.jsx"
      - "src/app/company/**"
      - "src/app/press/**"
      - "src/app/sitemap.js"
      - "src/app/page.jsx"
      - "src/app/agency-growth/page.jsx"
      - "src/tests/litix-brand-discovery.test.mjs"
      - ".github/workflows/litix-brand-discovery.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check src/lib/litixBrandDiscovery.mjs
      - run: node --test src/tests/litix-brand-discovery.test.mjs src/tests/litix-discovery-funnel.test.mjs
