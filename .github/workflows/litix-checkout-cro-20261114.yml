name: Litix checkout CRO — no-charge build and browser regression
on:
  push:
    branches:
      - fix/always-visible-paykings-checkout-20261114
      - fix/litix-checkout-final-polish-20261114
      - fix/checkout-final-micro-ux-20261114
      - fix/litix-hero-trust-placeholders-20261114
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  checkout-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout reviewed changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run no-charge checkout and catalog regressions
        run: node --test tests/presentation.test.mjs tests/litix-instant-checkout-20261114.test.mjs tests/litix-package-tiers-quantity-20261114.test.mjs tests/checkout-cro-20261114.test.mjs tests/litix-micro-ux-20261114.test.mjs
      - name: Compile Next.js application
        run: npm run build
      - name: Install isolated browser dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Validate visible CTA and live preflight without charging
        run: |
          npm run start -- --port 3100 >/tmp/litix-cro-browser.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/litix-instant-checkout-browser-20261114.mjs
          node tests/checkout-cro-browser-20261114.mjs
