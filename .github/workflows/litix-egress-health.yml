name: Litix owned egress health no-charge QA
on:
  pull_request:
    paths:
      - "src/app/api/fulfillment/health/route.js"
      - "src/tests/litix-owned-egress-health.test.mjs"
      - ".github/workflows/litix-egress-health.yml"
  push:
    branches:
      - fix/20261110-litix-owned-egress-health
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test src/tests/litix-owned-egress-health.test.mjs
