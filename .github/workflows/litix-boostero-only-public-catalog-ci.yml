name: Litix Boostero-only public storefront — isolated proof
on:
  push:
    branches:
      - fix/litix-hide-unavailable-legacy-storefront-20261028
permissions:
  contents: read
jobs:
  catalog-and-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify Boostero-only active catalog, retired route blocks and no supplier fallback
        run: |
          node --test tests/boostero-only-public-catalog-regression.test.mjs
      - name: Verify existing approved Boostero fulfillment and payment safety rules
        run: |
          node --test tests/boostero-readonly.test.mjs tests/owner-purchase-notifications.test.mjs tests/growth-bundles-manual.test.mjs
      - name: Ensure frontend and API compile with no runtime secrets
        run: npm run build
