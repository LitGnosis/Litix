name: Litix Native independent campaign and creator partnership QA
on:
  pull_request:
    paths:
      - "src/lib/litixNativeCampaign.mjs"
      - "src/lib/litixNativeSupplier.mjs"
      - "src/lib/partnerApplications.mjs"
      - "src/components/LitixNativeStudio.jsx"
      - "src/components/PartnerApplication.jsx"
      - "src/app/native/**"
      - "src/app/publishers/**"
      - "src/app/api/native/**"
      - "src/app/partners/**"
      - "src/tests/litixNativeCampaign.test.mjs"
      - "src/tests/litixNativeSupplier.test.mjs"
      - "src/tests/litixNativeApi.test.mjs"
      - "src/tests/litixNativePartnerApi.test.mjs"
      - "src/tests/partnerApplications.test.mjs"
      - ".github/workflows/litix-native-campaign-network-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source without Git credential persistence
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Verify first-party generation, exports, partner safety
        working-directory: src
        run: node --test tests/litixNativeCampaign.test.mjs tests/litixNativeSupplier.test.mjs tests/litixNativeApi.test.mjs tests/litixNativePartnerApi.test.mjs tests/partnerApplications.test.mjs
