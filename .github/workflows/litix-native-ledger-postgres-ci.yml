name: Litix Native partner ledger — isolated PostgreSQL QA
on:
  pull_request:
    paths:
      - "src/db/litix_native_partner_trial.sql"
      - "src/tests/litix_native_partner_schema_qa.sql"
      - ".github/workflows/litix-native-ledger-postgres-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: litix_native_qa
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d litix_native_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout no persisted Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply migration twice and run rolling-back fixtures in isolated CI PostgreSQL
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=postgres:16-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp src/db/litix_native_partner_trial.sql "$container_id:/tmp/native_migration.sql"
          docker cp src/tests/litix_native_partner_schema_qa.sql "$container_id:/tmp/native_qa.sql"
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U postgres -d litix_native_qa -f /tmp/native_migration.sql
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U postgres -d litix_native_qa -f /tmp/native_migration.sql
          docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U postgres -d litix_native_qa -f /tmp/native_qa.sql
