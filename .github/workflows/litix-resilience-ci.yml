name: Litix Resilience — bounded cron and prepaid safeguards
on:
  pull_request:
    paths:
      - "src/app/api/guardian/**"
      - "src/app/api/internal/boostero/**"
      - "src/lib/guardianRuntime.mjs"
      - "src/tests/litix-guardian-cron-resilience.test.mjs"
      - "src/vercel.json"
      - ".github/workflows/litix-resilience-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: No-charge Guardian and supplier cron regression
        run: node --test tests/litix-guardian-cron-resilience.test.mjs tests/guardian.test.mjs tests/guardian-signals.test.mjs tests/boostero-batch-status.test.mjs
        env:
          VERCEL_ENV: preview
      - name: Verify production Next.js build without secrets
        run: npm run build
