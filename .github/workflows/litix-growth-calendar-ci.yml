name: Litix Growth OS — local-only content calendar and preservation
on:
  push:
    branches:
      - feature/litix-growth-content-calendar-20261028
  pull_request:
    paths:
      - "src/app/growth/**"
      - "src/app/page.jsx"
      - "src/lib/growthCalendar.mjs"
      - "src/tests/growth-calendar*"
      - ".github/workflows/litix-growth-calendar-ci.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Run local calendar, checkout, AI, Guardian, Boostero, global SEO, and manual bundle tests
        run: |
          node --test \
            tests/growth-calendar.test.mjs \
            tests/checkout.test.mjs \
            tests/litix-ai.test.mjs \
            tests/guardian.test.mjs \
            tests/boostero-integration.test.mjs \
            tests/growth-bundles-manual.test.mjs \
            tests/global-locales.test.mjs \
            tests/global-seo-preservation.test.mjs
      - name: Build real Next.js production bundle without credentials or live transactions
        run: npm run build
      - name: Install sandboxed browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify mobile/desktop create, reload, edit, CSV and delete with mocked AI
        run: |
          npm run start -- --port 3100 >/tmp/litix-growth-calendar.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://localhost:3100/growth; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/growth-calendar-browser.mjs
