name: Litix Guardian retired - no-charge checks
on:
  pull_request:
    paths:
      - "src/vercel.json"
      - "src/lib/guardianRuntime.mjs"
      - "src/app/api/litix-ai/route.js"
      - "src/tests/guardian-retirement-20261118.test.mjs"
      - ".github/workflows/litix-guardian-retirement-ci.yml"
permissions:
  contents: read
jobs:
  retirement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src
      - run: node --test tests/guardian-retirement-20261118.test.mjs tests/guardian.test.mjs tests/litix-operational-resilience.test.mjs
        working-directory: src
      - run: npm run build
        working-directory: src
