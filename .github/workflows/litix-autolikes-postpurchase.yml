name: Litix AutoLikes Post-Purchase — No-Charge QA
on:
  push:
    branches: ["fix/autolikes-postpurchase-redirect-emails-20261104"]
  pull_request:
    paths:
      - "src/lib/litixPrepaidAutoLikesEmails.mjs"
      - "src/app/api/autolikes/prepaid/checkout/route.js"
      - "src/app/autolikes/page.jsx"
      - "src/components/LitixAutoLikesHomeNotice.jsx"
      - "src/app/page.jsx"
      - "src/tests/litix-autolikes-postpurchase.test.mjs"
      - ".github/workflows/litix-autolikes-postpurchase.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate test-only modules
        run: |
          node --check src/lib/litixPrepaidAutoLikesEmails.mjs
          node --check src/app/api/autolikes/prepaid/checkout/route.js
      - name: Test new checkout and mail behavior without payments
        run: |
          node --test src/tests/litix-autolikes-postpurchase.test.mjs
          node --test src/tests/litix-autolikes-checkout-callback.test.mjs
      - name: Install locked dependencies for existing supplier-mock tests
        run: npm ci --no-audit --no-fund
        working-directory: src
      - name: Test existing prepaid fulfillment safety with mock supplier
        run: node --test src/tests/litix-autolikes-prepaid.test.mjs
