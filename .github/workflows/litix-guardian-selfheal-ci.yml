name: Litix Guardian self-healing diagnostic unit tests
on:
  pull_request:
    paths:
      - "src/lib/guardianCore.mjs"
      - "src/lib/guardianRuntime.mjs"
      - "src/lib/guardianSignals.mjs"
      - "src/app/api/guardian/**"
      - "src/tests/guardian.test.mjs"
      - "src/tests/guardian-signals.test.mjs"
      - ".github/workflows/litix-guardian-selfheal-ci.yml"
permissions:
  contents: read
jobs:
  no-charge-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install pinned dependencies without secrets
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Test Guardian incident machine and non-destructive self diagnostics
        working-directory: src
        env:
          VERCEL_ENV: preview
        run: node --test tests/guardian.test.mjs tests/guardian-signals.test.mjs
