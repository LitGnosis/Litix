name: Litix Global Solutions Pilot — No Charge QA
on:
  push:
    branches:
      - feature/litix-global-solutions-pilots-20261104
    paths:
      - "src/lib/litixSolution*"
      - "src/app/solutions/**"
      - "src/app/api/solutions/**"
      - "src/app/tools/local-visibility/**"
      - "src/tests/litix-global-solutions.test.mjs"
      - ".github/workflows/litix-solutions-pilot.yml"
  pull_request:
    paths:
      - "src/lib/litixSolution*"
      - "src/app/solutions/**"
      - "src/app/api/solutions/**"
      - "src/app/tools/local-visibility/**"
      - "src/tests/litix-global-solutions.test.mjs"
      - ".github/workflows/litix-solutions-pilot.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Print Node runtime
        run: node --version
      - name: Check server-side JavaScript syntax
        run: |
          node --check src/lib/litixSolutions.mjs
          node --check src/lib/litixSolutionInquiries.mjs
          node --check src/app/api/solutions/inquiry/route.js
      - name: Run focused no-payment tests
        run: |
          node --test src/tests/litix-global-solutions.test.mjs
          node --test src/tests/partnerApplications.test.mjs
