name: Litix Global Phase 1 — Boostero-only new orders and source checkpoint
on:
  push:
    branches:
      - feature/litix-global-boostero-only-hardstop-20261028
  pull_request:
    paths:
      - "src/app/api/[action]/route.js"
      - "src/app/page.jsx"
      - "src/app/metallic.css"
      - "src/tests/boostero-exclusive-new-orders*"
      - ".github/workflows/litix-global-exclusive-ci.yml"
permissions:
  contents: read
jobs:
  no-charge-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify no new legacy charges, historical tracking, Boostero payments, sorting, bundles and notifications
        run: |
          node --test \
            tests/boostero-exclusive-new-orders.test.mjs \
            tests/boostero-public-routing.test.mjs \
            tests/boostero-four-kinds.test.mjs \
            tests/boostero-live-fulfillment.test.mjs \
            tests/checkout.test.mjs \
            tests/collect-lifecycle.test.mjs \
            tests/five-dollar-floor.test.mjs \
            tests/custom-orders-priority.test.mjs \
            tests/pricing-rules.test.mjs \
            tests/growth-bundles-manual.test.mjs \
            tests/owner-purchase-notifications.test.mjs \
            tests/public-supplier-display.test.mjs
      - name: Build production Next.js without real payment
        run: npm run build
      - name: Install isolated browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Mobile and desktop approved service checkout eligibility, no live charge
        run: |
          npm run start -- --port 3100 >/tmp/litix-exclusive-phase1.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent -o /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium; fi
          node tests/boostero-exclusive-new-orders-browser.mjs
  preserve-original-source:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build a sanitized, pinned source-only ZIP, with no DB/customer data
        run: |
          python - <<'PY'
          import subprocess,pathlib,re,json,hashlib,zipfile
          SHA="40ce4ad92f1eb1dfdbdb7ac7b571ca27ce89dee7"
          FILE="LITIX-GLOBAL-ORIGINAL-PRE-BOOSTERO-ONLY-20261028.zip"
          excluded_parts={".git",".next","node_modules",".vercel","coverage","dist","build","__pycache__"}
          blocked_names={".env",".env.local",".npmrc",".netrc","credentials.json","secrets.json"}
          secrets=[re.compile(rb"\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{10,}",re.I),
                   re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
                   re.compile(rb"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
                   re.compile(rb"\b(?:whsec|pk_live)_[A-Za-z0-9]{18,}\b")]
          paths=[p.decode() for p in subprocess.check_output(["git","ls-tree","-r","--name-only","-z",SHA]).split(b"\0") if p]
          included=[];removed=[]
          with zipfile.ZipFile(FILE,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
            for name in paths:
              p=pathlib.PurePosixPath(name)
              if any(x in excluded_parts for x in p.parts) or p.name in blocked_names or p.name.startswith(".env.") or p.suffix.lower() in {".pem",".key",".p12",".pfx",".sqlite",".db"}:
                removed.append(name);continue
              blob=subprocess.check_output(["git","show",SHA+":"+name])
              if len(blob)>15000000 or any(rule.search(blob) for rule in secrets):
                removed.append(name);continue
              archive.writestr(name,blob)
              included.append({"path":name,"sha256":hashlib.sha256(blob).hexdigest()})
            manifest={"repository":"LitGnosis/Litix","source_commit":SHA,"scope":"source-only (no environment values, passwords or customer records)","included_files":included,"excluded_paths":removed,"database_backup_included":False}
            archive.writestr("RECOVERY-MANIFEST.json",json.dumps(manifest,indent=2))
            archive.writestr("RECOVERY-INSTRUCTIONS.md","Exact Git source SHA: "+SHA+"\nRepository: LitGnosis/Litix\nRoot: src/\nRestore with git fetch then checkout exact SHA and npm ci / npm run build.\nThis ZIP is NOT a Neon database backup or a substitute for runtime environment configuration.\n")
          print("SOURCE_BACKUP_SHA256",hashlib.sha256(pathlib.Path(FILE).read_bytes()).hexdigest())
          print("FILES",len(included),"SKIPPED",len(removed),"SIZE",pathlib.Path(FILE).stat().st_size)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: litix-global-master-pre-boostero-only-20261028
          path: LITIX-GLOBAL-ORIGINAL-PRE-BOOSTERO-ONLY-20261028.zip
          if-no-files-found: error
          retention-days: 90
