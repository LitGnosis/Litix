name: Litix Verified Owner Notifications
on:
  push:
    branches: [fix/litix-owner-order-notifications-20261026]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Run all existing and owner-notification tests without payments
        working-directory: src
        run: node --test tests/*.test.mjs
      - name: Build unchanged storefront
        working-directory: src
        run: npm run build
