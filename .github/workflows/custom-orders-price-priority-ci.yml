name: LITIX Custom Orders — price-priority and mobile desktop regression
on:
  push:
    branches:
      - fix/custom-orders-category-price-sort-20261027
  pull_request:
    paths:
      - "src/lib/catalogSort.mjs"
      - "src/app/page.jsx"
      - "src/tests/custom-orders-priority.test.mjs"
      - "src/tests/custom-orders-mobile-desktop.mjs"
      - ".github/workflows/custom-orders-price-priority-ci.yml"
permissions:
  contents: read
jobs:
  sort-ui-and-checkout-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install existing locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all no-charge Node regression tests (browser suites run after Chromium setup)
        run: |
          test_files="$(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'dual-provider-mobile.test.mjs' | sort | tr '\n' ' ')"
          node --test $test_files
      - name: Compile Next.js production bundle without payments
        run: npm run build
      - name: Install isolated browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify real 320/375/390/430/1280px service ordering with mocked APIs
        run: |
          npm run start -- --port 3100 >/tmp/litix-custom-orders.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 35); do
            if curl --fail --silent --output /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            npx playwright install chromium
          fi
          node tests/custom-orders-mobile-desktop.mjs
          node tests/dual-provider-mobile.test.mjs
