name: Litix Business AI Ops & Lead Acknowledgement — No-Charge QA
on:
  push:
    branches:
      - growth/ai-ops-autoreply-20261109
  pull_request:
    paths:
      - "src/lib/litixLeadAcknowledgement.mjs"
      - "src/app/api/partners/route.js"
      - "src/components/PartnerApplication.jsx"
      - "src/components/LitixAgencyGrowthInquiry.jsx"
      - "src/app/agency-growth/page.jsx"
      - "src/lib/litixSolutions.mjs"
      - "src/tests/litix-lead-autoreply.test.mjs"
      - ".github/workflows/litix-lead-autoreply.yml"
permissions:
  contents: read
jobs:
  no-charge-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check src/lib/litixLeadAcknowledgement.mjs
      - run: node --test src/tests/litix-lead-autoreply.test.mjs src/tests/partnerApplications.test.mjs src/tests/litix-agency-growth-leads.test.mjs
