name: Litix blue storefront CRO - no charge
on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/litix-blue-storefront-cro-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-charge-build-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify payments remain untouched and public promises are grounded
        run: node --test tests/litix-blue-storefront-cro-20261118.test.mjs
      - name: Build production Next.js bundle without credentials or charges
        run: npm run build
