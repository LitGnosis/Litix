name: Litix AutoLikes Supplier Evaluation (No Orders)
on:
  push:
    branches:
      - feature/verified-autolikes-reseller-api-evaluation-20261104
  pull_request:
    paths:
      - "src/lib/litixSubscriptionSupplierEvaluation.mjs"
      - "src/tests/litix-reseller-autolikes-evaluation.test.mjs"
      - "src/lib/litixVerifiedAutoLikesSupplier.mjs"
      - "src/tests/litix-verified-autolikes-supplier.test.mjs"
      - ".github/workflows/litix-autolikes-provider-evaluation.yml"
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check src/lib/litixSubscriptionSupplierEvaluation.mjs
      - run: node --check src/lib/litixVerifiedAutoLikesSupplier.mjs
      - run: node --test src/tests/litix-reseller-autolikes-evaluation.test.mjs src/tests/litix-verified-autolikes-supplier.test.mjs
