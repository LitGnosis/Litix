name: Litix Lead Booking + Demonstration QA
on:
  push:
    branches:
      - growth/litix-booking-proof-20261109
  pull_request:
    paths:
      - "src/app/agency-growth/**"
      - "src/app/for-agencies/page.jsx"
      - "src/app/page.jsx"
      - "src/lib/litixLeadAcknowledgement.mjs"
      - "src/app/demo/lead-operations/**"
      - "src/tests/litix-discovery-funnel.test.mjs"
      - "src/app/sitemap.js"
      - ".github/workflows/litix-discovery-funnel.yml"
permissions:
  contents: read
jobs:
  no-charge-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test src/tests/litix-discovery-funnel.test.mjs src/tests/litix-lead-autoreply.test.mjs
