name: Litix Guardian Boostero-only provider regression
on:
  push:
    branches: [fix/litix-guardian-boostero-only-no-legacy-cron-20261028]
permissions:
  contents: read
jobs:
  guardian-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Mock supplier and Guardian no-charge checks
        run: node --test tests/litix-boostero-guardian-exclusive.test.mjs tests/guardian.test.mjs tests/boostero-readonly.test.mjs
      - run: npm run build
