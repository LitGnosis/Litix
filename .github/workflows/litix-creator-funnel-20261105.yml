name: Litix Creator Funnel - Privacy and Attribution Regression
on:
  push:
    branches:
      - feat/litix-creator-signup-referral-20261105
  pull_request:
    paths:
      - "src/app/api/creator-signup/**"
      - "src/app/api/affiliates/**"
      - "src/app/r/**"
      - "src/components/CreatorPlanSignup.jsx"
      - "src/lib/creatorFunnel.mjs"
      - "src/db/migrations/20261105-creator-signup-affiliate.sql"
      - "src/tests/litixCreatorAttribution20261105.test.mjs"
      - ".github/workflows/litix-creator-funnel-20261105.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated no-charge source tests
        run: node --test src/tests/litixCreatorAttribution20261105.test.mjs
