name: SMMGLOB read-only catalog resilience (no orders)
on:
  push:
    branches: [fix/litix-smmglob-catalog-transient-20261027]
  pull_request:
    paths:
      - "src/app/api/[action]/route.js"
      - "src/app/page.jsx"
      - "src/tests/catalog-smmglob-recovery.test.mjs"
      - "src/tests/catalog-mobile-resilience.mjs"
      - ".github/workflows/smmglob-catalog-recovery-ci.yml"
permissions:
  contents: read
jobs:
  catalog-nocharge:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        working-directory: src
        run: npm ci --no-audit --no-fund
      - name: Test supplier timeout/termination and storefront filtering (mocked, read-only)
        working-directory: src
        env:
          SMMGLOB_API_KEY: 'mock-only-not-real'
        run: node --test tests/catalog-smmglob-recovery.test.mjs tests/pricing-rules.test.mjs tests/checkout.test.mjs tests/follower-username-checkout.test.mjs
      - name: Production build (no live payment or supplier calls)
        working-directory: src
        run: npm run build
      - name: Use preinstalled mobile browser
        working-directory: src
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Mobile 390px catalog search, filters, selection, prices and source status
        working-directory: src
        run: |
          npm run start -- --port 3100 >/tmp/litix-catalog-next.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS -o /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_PATH"
          node tests/catalog-mobile-resilience.mjs
      - name: Archive verified source without credentials
        run: |
          git archive --format=zip --output=Litix-SMMGLOB-Catalog-Repair-2026-10-27.zip HEAD
          unzip -t Litix-SMMGLOB-Catalog-Repair-2026-10-27.zip | tail -n 1
      - name: Attach recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: litix-smmglob-catalog-repair-source
          path: Litix-SMMGLOB-Catalog-Repair-2026-10-27.zip
          retention-days: 30
