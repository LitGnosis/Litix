name: Instagram Choose Your Posts — no-charge verification
on:
  push:
    branches:
      - feature/instagram-choose-posts-20261027
  pull_request:
    paths:
      - "src/app/choose-posts/**"
      - "src/app/api/choose-posts/**"
      - "src/lib/choosePosts*"
      - "src/tests/choose-posts.test.mjs"
      - "src/db/migrations/20261027-instagram-choose-posts.sql"
      - ".github/workflows/choose-posts-ci.yml"
permissions:
  contents: read
jobs:
  no-charge-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Instagram multi-post, pricing, gateway, owner notifications and regression tests (mocked)
        run: node --test tests/choose-posts.test.mjs tests/checkout.test.mjs tests/collect-lifecycle.test.mjs tests/five-dollar-floor.test.mjs tests/pricing-rules.test.mjs tests/preview-checkout.test.mjs tests/owner-purchase-notifications.test.mjs tests/growth-bundles-manual.test.mjs tests/litix-ai.test.mjs tests/autolikes-coming-soon.test.mjs
      - name: Build Next.js safely without a card or supplier call
        run: npm run build
