name: Litix owned worker Linux hardening no-charge tests
on:
  pull_request:
    paths:
      - "ops/litix-reliability/deploy/**"
      - "ops/litix-reliability/litix_reliability/preflight.py"
      - ".github/workflows/litix-worker-hardening.yml"
  push:
    branches:
      - feature/20261110-owned-delivery-reliability
permissions:
  contents: read
jobs:
  validate-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate service bootstrap syntax
        run: bash -n ops/litix-reliability/deploy/install-on-vm.sh
      - name: Test service hardening and fail-closed configuration
        run: python -m unittest discover -s ops/litix-reliability/deploy/tests -p 'test_*.py' -v
