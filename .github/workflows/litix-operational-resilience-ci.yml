name: Litix bounded production operations and no-charge build
on:
  pull_request:
    paths:
      - 'src/lib/guardianRuntime.mjs'
      - 'src/lib/litixOperationalSchedule.mjs'
      - 'src/app/api/guardian/cron/**'
      - 'src/app/api/internal/boostero/cron/**'
      - 'src/vercel.json'
      - 'src/tests/litix-operational-resilience.test.mjs'
      - '.github/workflows/litix-operational-resilience-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test bounded operations and existing health-check behavior
        env:
          VERCEL_ENV: preview
        run: node --test tests/litix-operational-resilience.test.mjs tests/guardian.test.mjs tests/guardian-signals.test.mjs tests/boostero-batch-status.test.mjs
      - name: Build existing Litix storefront
        run: npm run build
